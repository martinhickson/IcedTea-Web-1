name: Maven .NET Distribution

on:
  workflow_dispatch:
    inputs:
      dotnet-self-contained:
        description: 'Bundle the .NET runtime in the launcher distribution'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  dotnet-distribution:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            launcher: bin/javaws.exe
            smoke-script: scripts/run-windows-dotnet-jnlp-smoke.ps1
          - os: ubuntu-latest
            rid: linux-x64
            launcher: bin/javaws
            smoke-script: scripts/run-linux-dotnet-jnlp-smoke.sh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Corretto 8 compiler
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'

      - name: Remember Corretto 8 home
        run: echo "JDK8_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Set up Corretto 21 Maven runtime
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure Maven for GitHub Packages
        run: |
          $settingsPath = Join-Path $HOME ".m2/settings.xml"
          $settingsDir = Split-Path -Parent $settingsPath
          if (-not (Test-Path $settingsDir)) {
            New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null
          }
          @"
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          "@ | Out-File -FilePath $settingsPath -Encoding UTF8
        shell: pwsh

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build Maven .NET distribution
        run: |
          $mvnArgs = @(
            "-P", "maven-distribution",
            "-pl", "icedtea-web-distribution",
            "-am",
            "install",
            "-Dmaven.test.skip=true",
            "-DskipTests",
            "-Djdk8.home=$env:JDK8_HOME",
            "-Ditw.dotnet.selfContained=${{ inputs.dotnet-self-contained }}",
            "-Ditw.dotnet.runtime.identifier=${{ matrix.rid }}"
          )
          & mvn @mvnArgs
        shell: pwsh

      - name: Build signed headless JNLP app
        run: |
          $mvnArgs = @(
            "-pl", "icedtea-web-integration",
            "process-test-classes",
            "-DskipTests",
            "-Djdk8.home=$env:JDK8_HOME",
            "-Ditw.jdk8.home=$env:JDK8_HOME"
          )
          & mvn @mvnArgs
        shell: pwsh

      - name: Smoke test packaged javaws launcher
        run: |
          $dist = Get-ChildItem "icedtea-web-distribution/target/dist" -Directory | Select-Object -First 1
          if ($null -eq $dist) {
            throw "Distribution directory not found"
          }
          $launcher = Join-Path $dist.FullName "${{ matrix.launcher }}"
          & $launcher -version
        shell: pwsh

      - name: Run Linux JNLP smoke test from normal distribution ZIP
        if: runner.os == 'Linux'
        run: |
          chmod +x "${{ matrix.smoke-script }}"
          ITW_SMOKE_BUILD_TEST_APP=false ITW_SMOKE_TIMEOUT_SECONDS=180 "${{ matrix.smoke-script }}"
        shell: bash

      - name: Build Linux native packages in Docker
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/linux/build-native-packages.sh packaging/linux/container-build-package.sh
          ITW_VERSION=1.0.1-SNAPSHOT \
          ITW_PACKAGE_FORMATS="deb rpm" \
          packaging/linux/build-native-packages.sh
        shell: bash

      - name: Run Windows JNLP smoke test from normal distribution ZIP
        if: runner.os == 'Windows'
        run: |
          $env:ITW_SMOKE_BUILD_TEST_APP = "false"
          $env:ITW_SMOKE_TIMEOUT_SECONDS = "180"
          & "${{ matrix.smoke-script }}"
        shell: pwsh

      - name: Build Windows MSI in Windows Server Core Docker
        if: runner.os == 'Windows'
        run: |
          $env:ITW_VERSION = "1.0.1-SNAPSHOT"
          & packaging/windows/build-msi.ps1
        shell: pwsh

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: icedtea-web-maven-${{ matrix.rid }}
          path: icedtea-web-distribution/target/*.zip
          if-no-files-found: error

      - name: Upload Linux native packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: icedtea-web-native-${{ matrix.rid }}
          path: |
            icedtea-web-distribution/target/native-packages/*.deb
            icedtea-web-distribution/target/native-packages/*.rpm
          if-no-files-found: error

      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: icedtea-web-msi-${{ matrix.rid }}
          path: icedtea-web-distribution/target/native-packages/*.msi
          if-no-files-found: error
