name: CI

on:
  push:
    branches:
      - 1.8
  pull_request:
    branches:
      - 1.8

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, JDK ${{ matrix.java-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            java-version: '11'
            profile: ci
            pack200-bootstrap: true
            bash-executable: bash
          - os: windows-2025
            java-version: '11'
            profile: ci
            pack200-bootstrap: true
            bash-executable: 'C:\Program Files\Git\usr\bin\bash.exe'
          - os: ubuntu-latest
            java-version: '17'
            profile: ci-pack200-unpack
            pack200-bootstrap: true
            bash-executable: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Corretto ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'corretto'

      - name: Set up Git Bash
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "C:\Program Files\Git\usr\bin\bash.exe")) {
            choco install git.install -y --no-progress
          }
          echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-jdk${{ matrix.java-version }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-jdk${{ matrix.java-version }}-m2-

      - name: Ensure pack200 Maven artifact (Maven Central)
        if: matrix.pack200-bootstrap
        run: |
          if ($env:OS -eq 'Windows_NT') {
            function Write-Detail { param([string]$Message) Write-Host $Message }
            . ./.powershell/workflows/ensure-pack200.ps1
            Ensure-Pack200MavenDependency
          } else {
            chmod +x scripts/ensure-pack200-maven.sh
            ./scripts/ensure-pack200-maven.sh
          }
        shell: pwsh

      - name: Run unit tests
        run: |
          $mvnArgs = @(
            "-s", "${{ github.workspace }}/.powershell/workflows/maven-settings.xml",
            "test",
            "-pl", "icedtea-web",
            "-am",
            "-P${{ matrix.profile }},coverage",
            "-Djdk11.home=$env:JAVA_HOME",
            "-Dbash.executable=${{ matrix.bash-executable }}"
          )
          & mvn @mvnArgs
        shell: pwsh

      - name: Run SQLite catalog Failsafe IT
        run: |
          $mvnArgs = @(
            "-s", "${{ github.workspace }}/.powershell/workflows/maven-settings.xml",
            "-pl", "icedtea-web",
            "failsafe:integration-test",
            "failsafe:verify",
            "-Dit.test=SqliteCacheCatalogIT",
            "-P${{ matrix.profile }},coverage",
            "-Djdk11.home=$env:JAVA_HOME",
            "-Dbash.executable=${{ matrix.bash-executable }}"
          )
          & mvn @mvnArgs
        shell: pwsh

      - name: Run pack.gz range IT (JDK 11 profile)
        if: matrix.java-version == '11' && runner.os == 'Linux'
        run: |
          $settings = "${{ github.workspace }}/.powershell/workflows/maven-settings.xml"
          $packageArgs = @(
            "-s", $settings,
            "-pl", "icedtea-web",
            "-am",
            "install",
            "-DskipTests",
            "-Djdk11.home=$env:JAVA_HOME",
            "-Dbash.executable=${{ matrix.bash-executable }}"
          )
          & mvn @packageArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $itArgs = @(
            "-s", $settings,
            "-pl", "icedtea-web-integration",
            "verify",
            "-Ppackgz-range-it",
            "-Djdk11.home=$env:JAVA_HOME",
            "-Ditw.jdk11.home=$env:JAVA_HOME",
            "-Dbash.executable=${{ matrix.bash-executable }}"
          )
          & mvn @itArgs
        shell: pwsh

      - name: Upload JaCoCo unit test report
        if: matrix.profile == 'ci' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-unit-coverage-jdk${{ matrix.java-version }}
          path: |
            icedtea-web/target/site/jacoco/
            icedtea-web/target/jacoco.exec
          if-no-files-found: error

  critical-release-gates:
    name: Critical JDK persistence gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6

      - name: Set up JDK 11, 17, and 21
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: |
            11
            17
            21

      - name: Remember JDK homes
        run: |
          echo "JDK11_HOME=$JAVA_HOME_11_X64" >> "$GITHUB_ENV"
          echo "JDK17_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "JDK21_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Install TigerVNC
        run: sudo apt-get update && sudo apt-get install -y tigervnc-standalone-server x11-utils

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ubuntu-critical-gates-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ubuntu-critical-gates-m2-

      - name: Ensure pack200 Maven artifact (Maven Central)
        run: |
          chmod +x scripts/ensure-pack200-maven.sh
          ./scripts/ensure-pack200-maven.sh

      - name: Run critical JDK persistence gates
        env:
          MAVEN_SETTINGS: ${{ github.workspace }}/.powershell/workflows/maven-settings.xml
        run: |
          chmod +x scripts/run-critical-jdk-persistence-gates.sh
          ./scripts/run-critical-jdk-persistence-gates.sh
