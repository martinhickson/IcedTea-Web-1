name: Maven Build (itw-maven)

on:
  workflow_dispatch:

jobs:
  maven-build:
    name: Maven Install (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Corretto 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'

      - name: Remember Corretto 8 home
        run: echo "JDK8_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
        shell: powershell

      - name: Set up Corretto 11 Maven runtime
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'corretto'

      - name: Remember Corretto 11 home
        run: echo "JDK11_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
        shell: powershell

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Configure Maven for GitHub Packages
        run: |
          $settingsPath = "$env:USERPROFILE\.m2\settings.xml"
          $settingsDir = Split-Path -Parent $settingsPath
          if (-not (Test-Path $settingsDir)) {
            New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null
          }
          @"
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          "@ | Out-File -FilePath $settingsPath -Encoding UTF8
        shell: powershell

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build with Maven
        run: |
          $mvnArgs = @(
            "-P", "maven-distribution",
            "install",
            "-Dmaven.test.skip=true",
            "-Djdk8.home=$env:JDK8_HOME",
            "-Djdk11.home=$env:JDK11_HOME"
          )
          & mvn @mvnArgs
        shell: powershell

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-artifacts
          path: |
            icedtea-web/target/*.jar
            icedtea-web/target/bin/*
            icedtea-web-distribution/target/*.zip
          if-no-files-found: ignore

