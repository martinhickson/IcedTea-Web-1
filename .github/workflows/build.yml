name: Build

on:
  workflow_dispatch:
    inputs:
      dotnet-self-contained:
        description: 'Bundle the .NET runtime in the launcher distribution'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  dotnet-distribution:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            launcher: bin/javaws.exe
            cli-launcher: bin/javawsc.exe
            smoke-script: scripts/run-windows-dotnet-jnlp-smoke.ps1
            corretto-url: https://corretto.aws/downloads/latest/amazon-corretto-11-x64-windows-jdk.zip
          - os: ubuntu-latest
            rid: linux-x64
            launcher: bin/javaws
            cli-launcher: bin/javawsc
            smoke-script: scripts/run-linux-dotnet-jnlp-smoke.sh
            corretto-url: https://corretto.aws/downloads/latest/amazon-corretto-11-x64-linux-jdk.tar.gz
          - os: macos-15-intel
            rid: osx-x64
            launcher: bin/javaws
            cli-launcher: bin/javawsc
            smoke-script: ''
            corretto-url: https://corretto.aws/downloads/latest/amazon-corretto-11-x64-macos-jdk.tar.gz
          - os: macos-15
            rid: osx-arm64
            launcher: bin/javaws
            cli-launcher: bin/javawsc
            smoke-script: ''
            corretto-url: https://corretto.aws/downloads/latest/amazon-corretto-11-aarch64-macos-jdk.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Corretto 11 compiler
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'corretto'

      - name: Remember Corretto 11 compiler home
        run: echo "JDK8_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Set up Corretto 11 Maven runtime
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'corretto'

      - name: Remember Corretto 11 home
        run: echo "JDK11_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-pack200-central-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Ensure pack200 Maven artifact (Maven Central)
        run: |
          if ($env:OS -eq 'Windows_NT') {
            function Write-Detail { param([string]$Message) Write-Host $Message }
            . ./.powershell/workflows/ensure-pack200.ps1
            Ensure-Pack200MavenDependency
          } else {
            chmod +x scripts/ensure-pack200-maven.sh
            ./scripts/ensure-pack200-maven.sh
          }
        shell: pwsh

      - name: Set up Git Bash
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "C:\Program Files\Git\bin\bash.exe")) {
            choco install git.install -y --no-progress
          }
          echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Build distribution
        env:
          MAVEN_SETTINGS: ${{ github.workspace }}/.powershell/workflows/maven-settings.xml
        run: |
          $mvnArgs = @(
            "-s", $env:MAVEN_SETTINGS,
            "-P", "maven-distribution",
            "-pl", "icedtea-web-distribution",
            "-am",
            "install",
            "-Dmaven.test.skip=true",
            "-DskipTests",
            "-Djdk8.home=$env:JDK8_HOME",
            "-Djdk11.home=$env:JDK11_HOME",
            "-Ditw.dotnet.selfContained=${{ inputs.dotnet-self-contained }}",
            "-Ditw.dotnet.runtime.identifier=${{ matrix.rid }}",
            "-Ditw.corretto.url=${{ matrix.corretto-url }}"
          )
          & mvn @mvnArgs
        shell: pwsh

      - name: Verify distribution launchers
        run: |
          $dist = Get-ChildItem "icedtea-web-distribution/target/dist" -Directory | Select-Object -First 1
          if ($null -eq $dist) {
            throw "Distribution directory not found"
          }
          $suffix = if ($env:OS -eq 'Windows_NT') { '.exe' } else { '' }
          $required = @('javaws', 'javawsc', 'icedtea-web-settings', 'itweb-settings', 'policyeditor')
          foreach ($name in $required) {
            $path = Join-Path $dist.FullName ("bin\" + $name + $suffix)
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing distribution launcher: $path"
            }
          }
          Write-Host "Verified distribution launchers: $($required -join ', ')"
        shell: pwsh

      - name: Build signed headless JNLP app
        env:
          MAVEN_SETTINGS: ${{ github.workspace }}/.powershell/workflows/maven-settings.xml
        run: |
          $mvnArgs = @(
            "-s", $env:MAVEN_SETTINGS,
            "-pl", "icedtea-web-integration",
            "process-test-classes",
            "-DskipTests",
            "-Djdk8.home=$env:JDK8_HOME",
            "-Ditw.jdk8.home=$env:JDK8_HOME"
          )
          & mvn @mvnArgs
        shell: pwsh

      - name: Smoke test packaged javawsc CLI launcher
        run: |
          $dist = Get-ChildItem "icedtea-web-distribution/target/dist" -Directory | Select-Object -First 1
          if ($null -eq $dist) {
            throw "Distribution directory not found"
          }
          $launcher = Join-Path $dist.FullName "${{ matrix.cli-launcher }}"
          & $launcher -version
        shell: pwsh

      - name: Run Linux JNLP smoke test from distribution tree
        if: runner.os == 'Linux'
        run: |
          chmod +x "${{ matrix.smoke-script }}"
          ITW_DOTNET_DIST_DIR="${{ github.workspace }}/icedtea-web-distribution/target/dist/icedtea-web-2.0.1-SNAPSHOT" \
          ITW_SMOKE_BUILD_TEST_APP=false ITW_SMOKE_TIMEOUT_SECONDS=180 "${{ matrix.smoke-script }}"
        shell: bash


      - name: Install xvfb for control panel smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
        shell: bash

      - name: Run Linux control panel smoke test from distribution tree
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/run-linux-control-panel-smoke.sh
          ITW_DOTNET_DIST_DIR="${{ github.workspace }}/icedtea-web-distribution/target/dist/icedtea-web-2.0.1-SNAPSHOT" \
          scripts/run-linux-control-panel-smoke.sh
        shell: bash

      - name: Assert bundled jspawnhelper is executable
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/assert-jspawnhelper-executable.sh
          scripts/assert-jspawnhelper-executable.sh "${{ github.workspace }}/icedtea-web-distribution/target/dist/icedtea-web-2.0.1-SNAPSHOT"
        shell: bash

      - name: Build Linux native packages in Docker
        if: runner.os == 'Linux'
        run: |
          chmod +x .packaging/workflows/linux/build-native-packages.sh .packaging/workflows/linux/container-build-package.sh
          ITW_VERSION=2.0.1-SNAPSHOT \
          ITW_PACKAGE_FORMATS="deb rpm" \
          .packaging/workflows/linux/build-native-packages.sh
        shell: bash

      - name: Run Windows JNLP smoke test from distribution tree
        if: runner.os == 'Windows'
        run: |
          $env:ITW_DOTNET_DIST_DIR = "${{ github.workspace }}\icedtea-web-distribution\target\dist\icedtea-web-2.0.1-SNAPSHOT"
          $env:ITW_SMOKE_BUILD_TEST_APP = "false"
          $env:ITW_SMOKE_TIMEOUT_SECONDS = "180"
          & "${{ matrix.smoke-script }}"
        shell: pwsh

      - name: Ensure Windows Docker service is running
        if: runner.os == 'Windows'
        run: |
          $dockerService = Get-Service -Name docker
          if ($dockerService.Status -ne "Running") {
            Start-Service -Name docker
          }
          docker version
        shell: pwsh

      - name: Build Windows MSI in Windows Server Core Docker
        if: runner.os == 'Windows'
        run: |
          $env:ITW_VERSION = "2.0.1-SNAPSHOT"
          & .packaging/workflows/windows/build-msi.ps1
        shell: pwsh

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          chmod +x .packaging/workflows/macos/build-dmg.sh .packaging/workflows/macos/prepare-macos-icon.sh
          ITW_VERSION=2.0.1-SNAPSHOT \
          ITW_MACOS_RID="${{ matrix.rid }}" \
          .packaging/workflows/macos/build-dmg.sh
        shell: bash

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: icedtea-web-maven-${{ matrix.rid }}
          path: icedtea-web-distribution/target/*.zip
          if-no-files-found: error

      - name: Upload Linux native packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: icedtea-web-native-${{ matrix.rid }}
          path: |
            icedtea-web-distribution/target/native-packages/*.deb
            icedtea-web-distribution/target/native-packages/*.rpm
          if-no-files-found: error

      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: icedtea-web-msi-${{ matrix.rid }}
          path: icedtea-web-distribution/target/native-packages/*.msi
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: icedtea-web-dmg-${{ matrix.rid }}
          path: icedtea-web-distribution/target/native-packages/*.dmg
          if-no-files-found: error
