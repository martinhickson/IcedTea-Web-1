name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version for distribution and native packages (e.g., 2.0.1)'
        required: true
        default: '2.0.1'
        type: string
      release_branch:
        description: 'Release branch to create and build'
        required: true
        default: 'release/icedtea-web-2.0.1'
        type: string
      release_tag:
        description: 'Release tag to create'
        required: true
        default: 'icedtea-web-2.0.1'
        type: string
      release_name:
        description: 'GitHub Release title'
        required: true
        default: 'IcedTea-Web v2.0.1'
        type: string
      dotnet-self-contained:
        description: 'Bundle the .NET runtime in the launcher distribution'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      sign-windows-artifacts:
        description: 'Sign Windows EXE/MSI release artifacts with Azure Key Vault'
        required: true
        default: false
        type: boolean
      include-linux-zip:
        description: 'Include the Linux x64 distribution ZIP on the GitHub release'
        required: true
        default: true
        type: boolean
      include-windows-zip:
        description: 'Include the Windows x64 distribution ZIP on the GitHub release'
        required: true
        default: false
        type: boolean
  pull_request:
    branches:
      - 1.8

permissions:
  contents: write
  packages: read

env:
  RELEASE_VERSION: ${{ inputs.release_version || '2.0.1-SNAPSHOT' }}

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    name: Prepare release branch and tag
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_BRANCH: ${{ inputs.release_branch }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RELEASE_NAME: ${{ inputs.release_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch from latest 1.8
        run: |
          git fetch origin 1.8
          git checkout -B "${RELEASE_BRANCH}" "origin/1.8"
          echo "Release branch ${RELEASE_BRANCH} based on origin/1.8 ($(git rev-parse --short HEAD))"

      - name: Set up Corretto 11 for release preparation
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'corretto'

      - name: Update Maven versions
        run: |
          mvn -P maven-distribution versions:set \
            -DnewVersion="${RELEASE_VERSION}" \
            -DprocessAllModules \
            -DgenerateBackupPoms=false

      - name: Commit and push release branch
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No release version changes to commit."
          else
            git commit -m "Release version ${RELEASE_VERSION}"
          fi
          git push --force-with-lease origin "${RELEASE_BRANCH}"

      - name: Create and push release tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Using existing tag: ${RELEASE_TAG}"
          else
            git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_VERSION}"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(cat <<EOF
          ## IcedTea-Web

          IcedTea-Web is a runtime for executing JNLP-based Java applications across Windows, Linux, and macOS.

          ### Highlights

          * **Cross-platform support**
            Provides consistent execution of JNLP applications on Windows x64, Linux x64, and macOS (Intel and Apple Silicon).

          * **Bundled Java runtime option**
            Supports distribution with a bundled Java runtime to ensure predictable execution environments across systems.

          * **Native packaging formats**
            Available as platform-native installers and archives for straightforward deployment in desktop and enterprise environments.

          * **Desktop administration tools**
            Registers IcedTea-Web Control Panel and Policy Editor in the application menu on Linux (Freedesktop/KDE/GNOME) and Windows (Start Menu), with themed icons for discoverable configuration and policy editing.

          * **Application runtime visibility**
            The control panel Running Apps tab presents live heap and resident memory utilization inline for each active JNLP session, refreshing automatically when the tab is opened and immediately after heap trim actions so administrators can observe memory reclamation without auxiliary dialogs.

          * **Cache operations with process coordination**
            Cache maintenance workflows identify running JNLP applications that may retain cached artifacts and provide stop and force-stop controls, enabling administrators to clear application-specific or global cache entries in a deliberate, coordinated manner.

          * **Detached .NET launcher with launch audit logs**
            By default the .NET javaws launcher exits after confirming the JDK child process has started, writing a launch record with .NET and JDK versions, child PID, and full paths to redirected standard output and standard error logs. Set deployment.keepJavawsProcess=true or deployment.keepjavaPrelaunchProcess=true to retain the previous blocking launcher behavior.

          * **Verifiable build outputs**
            Release artifacts include checksums to support integrity verification and secure distribution workflows.

          * **Reproducible build process**
            Built through a CI-driven pipeline designed to produce consistent, traceable release outputs from tagged source states.

          ### JNLP Experience

          JNLP provides a network-based application delivery model where applications are launched directly from a hosted descriptor. It enables centralized deployment, controlled updates, and consistent runtime configuration without requiring manual installation workflows on each client device.

          IcedTea-Web implements this model by providing a stable execution environment for JNLP applications on modern desktop systems, supporting predictable application launch behavior and centralized application management across diverse environments.

          Release branch: ${RELEASE_BRANCH}
          Tag: ${RELEASE_TAG}
          EOF
          )"
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --draft \
              --title "${RELEASE_NAME}" \
              --notes "${notes}"
          else
            gh release create "${RELEASE_TAG}" \
              --draft \
              --title "${RELEASE_NAME}" \
              --notes "${notes}"
          fi

  dotnet-distribution:
    if: always()
    needs: release
    name: Distribution (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            rid: win-x64
            launcher: bin/javaws.exe
            smoke-script: scripts/run-windows-dotnet-jnlp-smoke.ps1
            corretto-url: https://corretto.aws/downloads/latest/amazon-corretto-11-x64-windows-jdk.zip
          - os: ubuntu-latest
            rid: linux-x64
            launcher: bin/javaws
            smoke-script: scripts/run-linux-dotnet-jnlp-smoke.sh
            corretto-url: https://corretto.aws/downloads/latest/amazon-corretto-11-x64-linux-jdk.tar.gz
          - os: macos-15-intel
            rid: osx-x64
            launcher: bin/javaws
            smoke-script: ''
            corretto-url: https://corretto.aws/downloads/latest/amazon-corretto-11-x64-macos-jdk.tar.gz
          - os: macos-15
            rid: osx-arm64
            launcher: bin/javaws
            smoke-script: ''
            corretto-url: https://corretto.aws/downloads/latest/amazon-corretto-11-aarch64-macos-jdk.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_branch || github.ref }}

      - name: Set up Corretto 11 compiler
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'corretto'

      - name: Remember Corretto 11 compiler home
        run: echo "JDK8_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Set up Corretto 11 Maven runtime
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'corretto'

      - name: Remember Corretto 11 home
        run: echo "JDK11_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Configure Maven for GitHub Packages
        run: |
          $settingsPath = Join-Path $HOME ".m2/settings.xml"
          $settingsDir = Split-Path -Parent $settingsPath
          if (-not (Test-Path $settingsDir)) {
            New-Item -ItemType Directory -Path $settingsDir -Force | Out-Null
          }
          @"
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          "@ | Out-File -FilePath $settingsPath -Encoding UTF8
        shell: pwsh

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-pack200-intrinsic-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Ensure pack200 Maven artifact (GitHub release)
        run: |
          if ($env:OS -eq 'Windows_NT') {
            function Write-Detail { param([string]$Message) Write-Host $Message }
            . ./.powershell/workflows/ensure-pack200.ps1
            Ensure-Pack200MavenDependency
          } else {
            chmod +x scripts/ensure-pack200-maven.sh
            ./scripts/ensure-pack200-maven.sh
          }
        shell: pwsh

      - name: Set up Git Bash
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "C:\Program Files\Git\bin\bash.exe")) {
            choco install git.install -y --no-progress
          }
          echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files\Git\usr\bin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Build distribution
        run: |
          $selfContained = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.dotnet-self-contained }}"
          } else {
            "true"
          }
          $mvnArgs = @(
            "-P", "maven-distribution",
            "-pl", "icedtea-web-distribution",
            "-am",
            "install",
            "-Dmaven.test.skip=true",
            "-DskipTests",
            "-Djdk8.home=$env:JDK8_HOME",
            "-Djdk11.home=$env:JDK11_HOME",
            "-Ditw.dotnet.selfContained=$selfContained",
            "-Ditw.dotnet.runtime.identifier=${{ matrix.rid }}",
            "-Ditw.corretto.url=${{ matrix.corretto-url }}"
          )
          & mvn @mvnArgs
        shell: pwsh

      - name: Build signed headless JNLP app
        run: |
          $mvnArgs = @(
            "-pl", "icedtea-web-integration",
            "process-test-classes",
            "-DskipTests",
            "-Djdk8.home=$env:JDK8_HOME",
            "-Ditw.jdk8.home=$env:JDK8_HOME"
          )
          & mvn @mvnArgs
        shell: pwsh

      - name: Smoke test packaged javaws launcher
        run: |
          $dist = Get-ChildItem "icedtea-web-distribution/target/dist" -Directory | Select-Object -First 1
          if ($null -eq $dist) {
            throw "Distribution directory not found"
          }
          $launcher = Join-Path $dist.FullName "${{ matrix.launcher }}"
          & $launcher -version
        shell: pwsh

      - name: Run Linux JNLP smoke test from normal distribution ZIP
        if: runner.os == 'Linux'
        run: |
          chmod +x "${{ matrix.smoke-script }}"
          ITW_VERSION="${{ env.RELEASE_VERSION }}" \
          ITW_SMOKE_BUILD_TEST_APP=false \
          ITW_SMOKE_TIMEOUT_SECONDS=180 \
          "${{ matrix.smoke-script }}"
        shell: bash

      - name: Install xvfb for control panel smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
        shell: bash

      - name: Run Linux control panel smoke test from distribution tree
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/run-linux-control-panel-smoke.sh
          DIST_DIR="$(find icedtea-web-distribution/target/dist -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          ITW_DOTNET_DIST_DIR="$DIST_DIR" scripts/run-linux-control-panel-smoke.sh
        shell: bash

      - name: Build Linux native packages in Docker
        if: runner.os == 'Linux'
        run: |
          chmod +x .packaging/workflows/linux/build-native-packages.sh .packaging/workflows/linux/container-build-package.sh
          ITW_VERSION="${{ env.RELEASE_VERSION }}" \
          ITW_PACKAGE_FORMATS="deb rpm" \
          .packaging/workflows/linux/build-native-packages.sh
        shell: bash

      - name: Run Windows JNLP smoke test from normal distribution ZIP
        if: runner.os == 'Windows'
        run: |
          $env:ITW_VERSION = "${{ env.RELEASE_VERSION }}"
          $env:ITW_SMOKE_BUILD_TEST_APP = "false"
          $env:ITW_SMOKE_TIMEOUT_SECONDS = "180"
          & "${{ matrix.smoke-script }}"
        shell: pwsh

      - name: Ensure Windows Docker service is running
        if: runner.os == 'Windows'
        run: |
          $dockerService = Get-Service -Name docker
          if ($dockerService.Status -ne "Running") {
            Start-Service -Name docker
          }
          docker version
        shell: pwsh

      - name: Validate Windows signing secrets
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs['sign-windows-artifacts'] == true
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          KEYVAULT_URL: ${{ secrets.KEYVAULT_URL }}
          JNLP_JCA_SIGN_ALIAS: ${{ secrets.JNLP_JCA_SIGN_ALIAS }}
          JNLP_JCA_TSA_URL: ${{ secrets.JNLP_JCA_TSA_URL }}
        run: |
          $required = @(
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_CLIENT_SECRET',
            'KEYVAULT_URL',
            'JNLP_JCA_SIGN_ALIAS',
            'JNLP_JCA_TSA_URL'
          )
          $missing = $required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing.Count -gt 0) {
            Write-Warning "Windows artifact signing was requested, but these GitHub secrets are missing: $($missing -join ', ')"
            throw "Cannot sign Windows artifacts because required signing secrets are missing."
          }
        shell: pwsh

      - name: Install Microsoft Sign CLI
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs['sign-windows-artifacts'] == true
        run: |
          dotnet tool install --global --prerelease sign
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Sign Windows launcher EXEs in dist and rebuild ZIP
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs['sign-windows-artifacts'] == true
        env:
          KEYVAULT_URL: ${{ secrets.KEYVAULT_URL }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          JNLP_JCA_SIGN_ALIAS: ${{ secrets.JNLP_JCA_SIGN_ALIAS }}
          JNLP_JCA_TSA_URL: ${{ secrets.JNLP_JCA_TSA_URL }}
        run: |
          $env:ITW_VERSION = "${{ env.RELEASE_VERSION }}"
          $env:ITW_DIST_DIR = Join-Path (Get-Location) "icedtea-web-distribution/target/dist/icedtea-web-$($env:ITW_VERSION)"
          & .github/workflows/sign.ps1 -Phase Distribution
        shell: pwsh

      - name: Build Windows MSI in Windows Server Core Docker
        if: runner.os == 'Windows'
        env:
          ITW_REQUIRE_SIGNED_DIST: ${{ github.event_name == 'workflow_dispatch' && inputs['sign-windows-artifacts'] == true && 'true' || '' }}
        run: |
          $env:ITW_VERSION = "${{ env.RELEASE_VERSION }}"
          $env:ITW_DIST_DIR = Join-Path (Get-Location) "icedtea-web-distribution/target/dist/icedtea-web-$($env:ITW_VERSION)"
          & .packaging/workflows/windows/build-msi.ps1
        shell: pwsh

      - name: Sign Windows MSI release artifact
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs['sign-windows-artifacts'] == true
        env:
          KEYVAULT_URL: ${{ secrets.KEYVAULT_URL }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          JNLP_JCA_SIGN_ALIAS: ${{ secrets.JNLP_JCA_SIGN_ALIAS }}
          JNLP_JCA_TSA_URL: ${{ secrets.JNLP_JCA_TSA_URL }}
        run: |
          $env:ITW_VERSION = "${{ env.RELEASE_VERSION }}"
          & .github/workflows/sign.ps1 -Phase Msi
        shell: pwsh

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          chmod +x .packaging/workflows/macos/build-dmg.sh .packaging/workflows/macos/prepare-macos-icon.sh
          ITW_VERSION="${{ env.RELEASE_VERSION }}" \
          ITW_MACOS_RID="${{ matrix.rid }}" \
          .packaging/workflows/macos/build-dmg.sh
        shell: bash

      - name: Generate checksums
        run: |
          $patterns = @(
            "icedtea-web-distribution/target/*.zip",
            "icedtea-web-distribution/target/native-packages/*.deb",
            "icedtea-web-distribution/target/native-packages/*.rpm",
            "icedtea-web-distribution/target/native-packages/*.msi",
            "icedtea-web-distribution/target/native-packages/*.dmg"
          )
          foreach ($pattern in $patterns) {
            Get-ChildItem $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              $hash = Get-FileHash -Algorithm SHA256 $_.FullName
              "$($hash.Hash.ToLowerInvariant())  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256.txt" -Encoding ASCII
            }
          }
        shell: pwsh

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: icedtea-web-${{ matrix.rid }}
          path: |
            icedtea-web-distribution/target/*.zip
            icedtea-web-distribution/target/*.zip.sha256.txt
          if-no-files-found: error

      - name: Upload Linux native packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: icedtea-web-native-${{ matrix.rid }}
          path: |
            icedtea-web-distribution/target/native-packages/*.deb
            icedtea-web-distribution/target/native-packages/*.rpm
            icedtea-web-distribution/target/native-packages/*.deb.sha256.txt
            icedtea-web-distribution/target/native-packages/*.rpm.sha256.txt
          if-no-files-found: error

      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: icedtea-web-msi-${{ matrix.rid }}
          path: |
            icedtea-web-distribution/target/native-packages/*.msi
            icedtea-web-distribution/target/native-packages/*.msi.sha256.txt
          if-no-files-found: error

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: icedtea-web-dmg-${{ matrix.rid }}
          path: |
            icedtea-web-distribution/target/native-packages/*.dmg
            icedtea-web-distribution/target/native-packages/*.dmg.sha256.txt
          if-no-files-found: error

  upload-release-assets:
    name: Upload release assets
    needs: dotnet-distribution
    if: github.event_name == 'workflow_dispatch' && needs.dotnet-distribution.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_branch }}

      - name: Download all distribution artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: icedtea-web-*
          merge-multiple: true
          path: release-assets

      - name: Upload release assets in platform order
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITW_INCLUDE_LINUX_ZIP: ${{ inputs.include-linux-zip }}
          ITW_INCLUDE_WINDOWS_ZIP: ${{ inputs.include-windows-zip }}
        run: |
          chmod +x .github/workflows/upload-release-assets.sh
          .github/workflows/upload-release-assets.sh "${{ inputs.release_tag }}" release-assets
