# Logging configuration for IcedTea-Web performance tests
.level=INFO

# IcedTea-Web specific loggers
net.sourceforge.jnlp.level=DEBUG
net.sourceforge.jnlp.runtime.level=DEBUG
net.sourceforge.jnlp.cache.level=DEBUG
net.sourceforge.jnlp.util.level=DEBUG

# Console handler
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tY-%1$tm-%1$td %1$tH:%1$tM:%1$tS %4$s %2$s %5$s%6$s%n
